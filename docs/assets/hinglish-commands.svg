<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Hinglish Commands by Udgam Labs</title>
  <desc id="desc">Everyday words, structured intent. The recorded request bed time ka alarm kab hai is interpreted as an alarm lookup with bed time as its alarm name. Your application decides what happens next.</desc>
  <rect width="1200" height="480" fill="#edf4ee"/>
  <path d="M44 61H1156M44 435H1156" stroke="#b9c9be"/>
  <g fill="#182724" font-family="Trebuchet MS,Verdana,sans-serif">
    <text x="44" y="40" font-size="13" font-weight="bold" letter-spacing="2">UDGAM LABS</text>
    <text x="1156" y="40" text-anchor="end" font-size="11" letter-spacing="1">QWEN3-0.6B ADAPTER / EXPERIMENTAL RELEASE</text>
    <text x="44" y="113" font-size="11" letter-spacing="1.5" fill="#0b6448">ENGLISH + ROMANIZED HINGLISH</text>
    <text x="44" y="181" font-family="Georgia,serif" font-size="56" letter-spacing="-2">Everyday words.</text>
    <text x="44" y="239" font-family="Georgia,serif" font-size="56" font-style="italic" letter-spacing="-2" fill="#0b6448">Structured intent.</text>
    <text x="44" y="297" font-size="17">A small model for eight command domains.</text>
    <text x="44" y="325" font-size="17">Your application decides what happens next.</text>
    <text x="44" y="405" font-size="12" fill="#59675f">Model weights · Training details · Benchmarks · Python interface</text>
  </g>
  <g transform="translate(695 100)">
    <rect width="461" height="304" fill="#fafcf9" stroke="#b9c9be"/>
    <g font-family="Trebuchet MS,Verdana,sans-serif" fill="#182724">
      <text x="25" y="32" font-size="11" letter-spacing="1" fill="#59675f">A RECORDED BENCHMARK EXAMPLE</text>
      <text x="25" y="83" font-family="Georgia,serif" font-size="29">“bed time ka alarm kab hai?”</text>
      <path d="M25 109H436" stroke="#d9e3dc"/>
      <text x="25" y="139" font-size="11" fill="#59675f">THE MODEL'S INTERPRETATION</text>
      <text x="25" y="181" font-size="13" fill="#59675f">Intent</text>
      <text x="436" y="181" text-anchor="end" font-size="17" font-weight="bold">Look up an alarm</text>
      <path d="M25 197H436" stroke="#d9e3dc"/>
      <text x="25" y="224" font-size="13" fill="#59675f">Alarm name</text>
      <text x="436" y="224" text-anchor="end" font-size="17" font-weight="bold">bed time</text>
      <text x="25" y="276" font-size="11" fill="#0b6448">The parser provides information. It executes no actions.</text>
    </g>
  </g>
</svg>
